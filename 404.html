<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foamies</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D3D47">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0D3D47; color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px; min-height: 100%;
    }
    .card { max-width: 380px; }
    .logo { font-weight: 800; font-size: 34px; letter-spacing: .5px; margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 700; margin: 18px 0 8px; }
    p { color: rgba(255,255,255,.85); font-size: 15px; line-height: 1.5; margin-bottom: 8px; }
    .btn {
      display: inline-block; margin-top: 18px; background: #E8450A; color: #fff;
      text-decoration: none; font-weight: 700; font-size: 16px;
      padding: 14px 26px; border-radius: 22px;
    }
    .muted { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 22px; }
    .muted a { color: #A8E6F1; }
    .stores { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .stores img { height: 44px; width: auto; display: block; }
    #fallback { display: none; }
    .spinner {
      width: 26px; height: 26px; margin: 8px auto 0; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25); border-top-color: #A8E6F1;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/assets/consent.js" defer></script>
</head>
<body>
  <div class="card">
    <div class="logo">Foamies</div>

    <div id="loading">
      <p id="opening">Opening in the Foamies app…</p>
      <div class="spinner"></div>
    </div>

    <div id="fallback">
      <h1 id="ftitle">Open this profile in Foamies</h1>
      <p id="fbody">Tap below to open it in the app.</p>
      <a class="btn" id="openBtn" href="#">Open in Foamies</a>
      <p class="muted" id="fmore">Don't have the app yet? It's free:</p>
      <div class="stores">
        <a href="https://apps.apple.com/fr/app/foamiesapp/id6788300215">
          <img id="iosBadge" src="/assets/appstore-en-us.svg" alt="Download on the App Store">
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.foamiesclub.dev&utm_source=site&utm_medium=deeplink">
          <img id="androidBadge" src="/assets/googleplay-en-us.png" alt="Get it on Google Play">
        </a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var fr = (navigator.language || 'en').toLowerCase().indexOf('fr') === 0;
      // With the app installed, the phone opens these links in it directly
      // (.well-known on this site + the domain declared in the app). This page
      // is what shows otherwise: no app, or an in-app browser like Instagram's
      // that keeps links to itself.
      var m = location.pathname.match(/^\/(user|session|planned)\/([^\/?#]+)/);
      // Anything else is a real 404: go home.
      if (!m) { location.replace(fr ? '/fr/' : '/'); return; }
      var kind = m[1];

      var T = fr ? {
        opening: 'Ouverture dans l’app Foamies…',
        title: kind === 'user' ? 'Ouvre ce profil dans Foamies'
             : kind === 'planned' ? 'Ouvre cette sesh dans Foamies'
             : 'Ouvre cette session dans Foamies',
        body: 'Appuie ci-dessous pour l’ouvrir dans l’app.',
        btn: 'Ouvrir dans Foamies',
        more: 'Pas encore l’app ? Elle est gratuite :'
      } : {
        opening: 'Opening in the Foamies app…',
        title: kind === 'user' ? 'Open this profile in Foamies'
             : kind === 'planned' ? 'Open this sesh in Foamies'
             : 'Open this session in Foamies',
        body: 'Tap below to open it in the app.',
        btn: 'Open in Foamies',
        more: 'Don’t have the app yet? It’s free:'
      };
      document.getElementById('opening').textContent = T.opening;
      document.getElementById('ftitle').textContent = T.title;
      document.getElementById('fbody').textContent = T.body;
      document.getElementById('openBtn').textContent = T.btn;
      document.getElementById('fmore').textContent = T.more;
      if (fr) {
        document.documentElement.lang = 'fr';
        document.getElementById('iosBadge').src = '/assets/appstore-fr-fr.svg';
        document.getElementById('androidBadge').src = '/assets/googleplay-fr-fr.png';
      }

      var appUrl = 'foamiesapp://' + kind + '/' + encodeURIComponent(m[2]);
      document.getElementById('openBtn').setAttribute('href', appUrl);

      // Try to open the app immediately.
      window.location.href = appUrl;

      // If we're still here after a moment, show the manual fallback.
      setTimeout(function () {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }, 1200);
    })();
  </script>
</body>
</html>
